<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 526" role="img"
     aria-label="Violin plot: trains that were punctual in August stay punctual in September — trains that were late in August stay late.">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .subtitle { font-size: 13.5px; fill: #646973; }
    .tick     { font-size: 12px; fill: #8a8f98; }
    .axis     { font-size: 12.5px; fill: #646973; }
    .xname    { font-size: 13px; font-weight: 600; fill: #282d37; }
    .xmed     { font-size: 11.5px; fill: #8a8f98; }
    .corner   { font-size: 13px; font-weight: 600; fill: #282d37;
                 paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
    .footer   { font-size: 11px; fill: #8a8f98; }
  </style>

  <rect width="760" height="526" fill="#ffffff"/>

  <text class="subtitle" x="40" y="28">Trains are grouped by their average August delay: punctual ones on the left, late ones on the right.</text>
  <text class="subtitle" x="40" y="46">Each shape shows how their average September delay is distributed: the wider, the more frequent. Dot = median.</text>

